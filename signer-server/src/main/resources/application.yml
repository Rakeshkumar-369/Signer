# Signer Server configuration. Every value can be overridden with an environment variable,
# e.g. SIGNER_PUBLIC_URL, SPRING_DATASOURCE_URL, SIGNER_ADMIN_INITIAL_PASSWORD.
server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* only from proxies on private/loopback addresses (Tomcat RemoteIpValve defaults)
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  tomcat:
    max-swallow-size: 64MB

spring:
  application:
    name: signer-server
  datasource:
    # Default: embedded file database (good for a single VM). For production use PostgreSQL or MySQL:
    #   jdbc:postgresql://db:5432/signer   |   jdbc:mysql://db:3306/signer
    url: jdbc:h2:file:${signer.data-dir}/db/signer
    username: signer
    password: signer
  flyway:
    locations: classpath:db/migration/{vendor}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

signer:
  # Folder for the embedded database, keys and licence file
  data-dir: ./data
  # External base URL of this server (used in agent configuration snippets and the demo)
  public-url: http://localhost:8080
  issuer: signer-server
  token:
    key-file: ${signer.data-dir}/keys/token-signing.pem
    # Extra public keys still accepted by agents during key rotation (kid=base64url,...)
    additional-public-keys: ""
    default-ttl-seconds: 300
    max-ttl-seconds: 1800
    max-documents: 100
  sessions:
    ttl-minutes: 30
    max-pdf-mb: 25
  tsa:
    url: ""
    username: ""
    password: ""
  verification:
    trust-anchors-dir: ${signer.data-dir}/trust
    check-revocation: false
    fetch-issuers: false
  admin:
    initial-username: admin
    # Leave empty to generate a random password that is printed once in the log
    initial-password: ""
    session-hours: 8
  license:
    file: ${signer.data-dir}/license.lic
  demo:
    # Creates a "demo" tenant and serves /demo/ so the whole flow can be tried in a browser
    enabled: true
  max-request-mb: 40
