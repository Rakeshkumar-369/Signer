# nginx TLS reverse proxy in front of Signer Server (listening on 127.0.0.1:8080).
server {
    listen 443 ssl http2;
    server_name signer.example.gov.in;

    ssl_certificate     /etc/ssl/certs/signer.example.gov.in.crt;
    ssl_certificate_key /etc/ssl/private/signer.example.gov.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # PDFs are sent as Base64 JSON: allow ~1.4x the largest document
    client_max_body_size 40m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name signer.example.gov.in;
    return 301 https://$host$request_uri;
}
