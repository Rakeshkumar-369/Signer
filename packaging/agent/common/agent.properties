# Signer Agent - site configuration installed next to the application.
# Users can override values in %APPDATA%\Signer\agent.properties.
# Run "Signer Agent.exe --print-defaults" to see every available setting.

# Signer Server of your organisation (its public keys are downloaded and cached)
security.mode=token
security.serverUrl=https://signer.example.gov.in

# Limit the agent to your applications (optional; recommended)
# security.allowedOrigins=https://eoffice.example.gov.in

# Port used by web pages to reach the agent
agent.port=1645
