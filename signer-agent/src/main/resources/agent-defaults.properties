# ---------------------------------------------------------------------------
# Signer Agent - default configuration
#
# Override any value in (later files win):
#   1. <install folder>\agent.properties          (set by the administrator / MSI)
#   2. %APPDATA%\Signer\agent.properties          (per user; ~/.config/signer on Linux/macOS)
#   3. JVM system properties  -Dsigner.<key>=<value>
# ---------------------------------------------------------------------------

# Local HTTP endpoint used by web applications (always bound to loopback).
agent.port=1645

# token     : every request must carry a transaction token issued by the Signer server (recommended, licensed mode)
# allowlist : no token; only the origins listed in security.allowedOrigins may use the agent (on-premise, unlicensed mode)
security.mode=token
# Comma separated list of web origins, e.g. https://eoffice.ap.gov.in,https://hrms.ap.gov.in
# In token mode an empty list means "any origin holding a valid token for that origin".
security.allowedOrigins=
# Signer server base URL; its public keys are downloaded from <url>/.well-known/signer-keys and cached.
security.serverUrl=
# Static alternative to serverUrl: kid=base64url-public-key[,kid=key...]
security.trustedKeys=
# Allow requests without an Origin header (desktop applications). Their token origin must be "native".
security.allowNativeClients=false

# dialog : show a confirmation window (with PIN entry for PKCS#11 tokens) for every signing transaction
# auto   : sign without asking (ONLY for unattended kiosks / automated tests)
consent.mode=dialog
consent.timeoutSeconds=120
# PIN used by consent.mode=auto for PKCS#11 tokens (testing only)
consent.autoPin=

# Where to look for certificates: windows (Windows certificate store; works with all tokens that install a
# minidriver/CSP), pkcs11 (vendor PKCS#11 library), pkcs12 (software certificate file - testing only)
token.providers=windows,pkcs11
# PKCS#11 libraries of common Indian DSC tokens. Entries that do not exist on the machine are ignored.
pkcs11.libraries=C:/Windows/System32/eps2003csp11v2.dll;C:/Windows/System32/eps2003csp11.dll;\
  C:/Windows/System32/SignatureP11.dll;C:/Windows/System32/CryptoIDA_pkcs11.dll;\
  C:/Windows/System32/eTPKCS11.dll;C:/Windows/System32/IDPrimePKCS11.dll;\
  C:/Windows/System32/TRUSTKEYP11_ND_v34.dll;\
  C:/Windows/System32/ShuttleCsp11_3003.dll;C:/Windows/System32/bit4ipki.dll;\
  /usr/lib/libcastle_v2.so.1.0.0;/usr/lib/WatchData/ProxKey/lib/libwdpkcs_SignatureP11.so;\
  /usr/lib/libeTPkcs11.so;/usr/local/lib/libeTPkcs11.dylib;/usr/lib/softhsm/libsofthsm2.so
# Number of PKCS#11 slots probed per library
pkcs11.maxSlots=4
# Log out of the token after each transaction so the PIN is asked every time
pkcs11.logoutAfterSign=true
pkcs12.file=
pkcs12.password=

# Only offer certificates whose issuer DN matches this regular expression (empty = all issuers)
certificates.issuerFilter=
certificates.hideExpired=true

signing.maxDocumentMb=25
signing.maxBatch=50

# RFC 3161 timestamp authority used when a request asks for a timestamp
tsa.url=
tsa.username=
tsa.password=
# Allow requests to embed revocation data (requires internet access to the CA's OCSP/CRL servers)
ltv.enabled=true
# Download missing CA certificates from AIA URLs when building the chain
network.fetchIssuers=true

# Accept the APTS / "PKI Network" style command API on POST / (pkiNetworkCertExt, pkinetworksign)
legacy.enabled=true

# Register the agent to start at Windows logon (installed builds only)
autostart=true
