# Production-style deployment: Signer Server + PostgreSQL.
#   1. Copy .env.example to .env and set the values.
#   2. docker compose up -d
#   3. Put a TLS reverse proxy (packaging/server/nginx-signer.conf) in front of port 8080.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: signer
      POSTGRES_USER: signer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signer -d signer"]
      interval: 10s
      retries: 10

  signer:
    build: .
    image: signer-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/signer
      SPRING_DATASOURCE_USERNAME: signer
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SIGNER_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      SIGNER_ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SIGNER_TSA_URL: ${TSA_URL:-}
      SIGNER_TSA_USERNAME: ${TSA_USERNAME:-}
      SIGNER_TSA_PASSWORD: ${TSA_PASSWORD:-}
      SIGNER_DEMO_ENABLED: ${DEMO_ENABLED:-false}
    volumes:
      - signer-data:/data

volumes:
  db-data:
  signer-data:
