name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.1)"
        required: true
        default: "1.0.0"

jobs:
  windows-msi:
    runs-on: windows-2022
    env:
      # Optional repository secrets for Authenticode signing of the MSI
      SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install WiX Toolset 3.14
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Decode code-signing certificate
        if: ${{ env.SIGN_CERT_PFX_BASE64 != '' }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:SIGN_CERT_PFX_BASE64))
          echo "SIGN_CERT_PFX=$env:RUNNER_TEMP\codesign.pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build MSI
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          powershell -ExecutionPolicy Bypass -File packaging\agent\windows\build-msi.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with:
          name: signer-agent-windows
          path: target/installer/*.msi

  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build .deb and server jar
        run: |
          V="${{ github.event.inputs.version }}"; [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          ./packaging/agent/linux/build-deb.sh "$V"
          mvn -B -q -DskipTests -pl signer-server -am package
      - uses: actions/upload-artifact@v4
        with:
          name: signer-agent-linux
          path: target/installer/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: signer-server
          path: signer-server/target/signer-server.jar
