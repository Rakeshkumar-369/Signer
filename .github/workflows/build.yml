name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install SoftHSM (PKCS#11 token emulator for tests)
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Build and run all tests
        run: mvn -B verify
      - name: Check browser SDK syntax
        run: node -e "require('./sdk/js/signer.js'); require('./sdk/node/signer-server-client.js')"
      - uses: actions/upload-artifact@v4
        with:
          name: signer-jars
          path: |
            signer-server/target/signer-server.jar
            signer-agent/target/signer-agent.jar
          retention-days: 14
